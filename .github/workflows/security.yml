# Filesystem vulnerabilities, OSV lockfile scan, and a Syft SBOM artifact.
name: security
"on":
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy fs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: "true"
          severity: HIGH,CRITICAL
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            .
      - name: syft sbom artifact
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          syft-version: "1.54.1"
          upload-artifact: "true"
          upload-release-assets: "false"
