# Template. Replace the placeholder with YOUR age PUBLIC key (age1...).
# Private key lives only at ~/.config/sops/age/keys.txt. Never in git.
creation_rules:
  - path_regex: '.*\.enc\.env$'
    age: "age1REPLACE_WITH_YOUR_PUBLIC_KEY"
  - path_regex: '.*\.enc\.(ya?ml|json)$'
    age: "age1REPLACE_WITH_YOUR_PUBLIC_KEY"
